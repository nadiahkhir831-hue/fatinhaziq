<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/effc47ebc5.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <title>Tambah ke Troli</title>
</head>

<body>

    <h1>Fatin's Cereal Market</h1>

<div class="utama">

    <div class="pertama">
        <table>
            <tr>
                <th>Barang</th>
                <th>Harga</th>
            </tr>
            <tr>
                <td>Koko Krunch</td>
                <td>RM 12.00</td>
                <td><button class="beli"onclick="tambahData(
                {nama: 'koko kruch', harga: 12})"><i class="fa-solid fa-cart-shopping"></i> Beli</button></td>
            </tr>

            <tr>
                <td>Honey Star</td>
                <td>RM 10.00</td>
                <td><button class="beli"onclick="tambahData(
                {nama: 'Honey star', harga: 10})"><i class="fa-solid fa-cart-shopping"></i> Beli</button></td>
            </tr>

            <tr>
                <td>Froot Loops</td>
                <td>RM 15.00</td>
                <td><button class="beli"onclick="tambahData(
                {nama: 'Froot Loops', harga: 15})"><i class="fa-solid fa-cart-shopping"></i> Beli</button></td>
            </tr>

            <tr>
                <td>Corn Flakes</td>
                <td>RM 12.00</td>
                <td><button class="beli"onclick="tambahData(
                {nama: 'Corn Flakes', harga: 12})"><i class="fa-solid fa-cart-shopping"></i> Beli</button></td>
            </tr>

            <tr>
                <td>Cheerios</td>
                <td>RM 15.00</td>
                <td><button class="beli"onclick="tambahData(
                {nama: 'Cheerios', harga: 15})"><i class="fa-solid fa-cart-shopping"></i> Beli</button></td>
            </tr>
        </table>
    </div>

    <div class="kedua">
        <div class="kandungan-kedua" id="troli">
            <div class="teks-kiri">Koko krunch (1x)</div>
            <div class="teks-kanan">
                <button class="buang">
                    <i class="fa-solid fa-trash-can"></i> Buang
                </button>
            </div>
        </div>

        <div class="jumlah">
          <!-- <p>Jumlah</p> -->
            <div id="jumlah">
            <div class="teks-kiri">Jumlah</div>
            <div class="teks-kanan bold">RM 12.00</div>
        </div>
    </div>

</div>
 <script src="./index.js"></script>
</body>
</html>
