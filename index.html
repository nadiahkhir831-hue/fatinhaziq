<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JobSheet AI Website</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY */
body{
    font-family:'Poppins',sans-serif;
    color:white;
    min-height:100vh;

    background:linear-gradient(-45deg,#000000,#0f0c29,#302b63,#24243e);
    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
}

/* BG ANIMATION */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* CANVAS */
#space{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

/* HEADER */
header{
    text-align:center;
    padding:30px 20px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,0.1);
}

header h1{
    font-size:clamp(1.8rem, 3vw, 2.5rem);
    color:#00fff0;
}

/* NAV */
nav{
    margin-top:15px;
}

nav a{
    text-decoration:none;
    margin:5px;
    padding:8px 16px;
    border-radius:30px;
    font-size:14px;

    color:#fff;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.2);

    transition:0.3s;
}

nav a:hover{
    background:#00fff0;
    color:black;
    box-shadow:0 0 10px #00fff0;
}

/* MAIN WRAPPER (IMPORTANT) */
.wrapper{
    display:flex;
    justify-content:center;
    padding:40px 15px;
}

/* CARD */
.card{
    width:100%;
    max-width:650px; /* 🔥 ini bagi tak kembang kat laptop */
    
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);

    padding:30px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.1);

    text-align:center;
    box-shadow:0 0 40px rgba(0,255,255,0.1);
}

/* TEXT */
.card h2{
    font-size:clamp(1.5rem, 2.5vw, 2rem);
    color:#ff00ff;
    margin-bottom:15px;
}

.card p{
    font-size:clamp(0.95rem, 1.2vw, 1.1rem);
    color:#ddd;
    line-height:1.7;
}

/* FOOTER */
footer{
    text-align:center;
    padding:15px;
    font-size:0.85rem;
    color:#aaa;
}

/* EXTRA MOBILE FIX */
@media(max-width:480px){
    .card{
        padding:20px;
    }
}

</style>
</head>

<body>

<canvas id="space"></canvas>

<header>
    <h1>🚀 JobSheet AI Website</h1>
    <nav>
        <a href="#">Home</a>
        <a href="about.html">About</a>
    </nav>
</header>

<div class="wrapper">
    <div class="card">
        <h2>Introduction</h2>
        <p>
            This is our JobSheet submission website.
        </p>
        <p>
            We created this website to show our progress 
            for our lecturers. This helps prevent lost assignments and 
            keeps the submission process more organized.
        </p>
    </div>
</div>

<footer>
    <p>© 2026 JobSheet AI Website</p>
</footer>

<script>
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

for(let i=0;i<150;i++){
    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        radius:Math.random()*1.2,
        alpha:Math.random(),
        speed:Math.random()*0.02
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    stars.forEach(star=>{
        star.alpha += star.speed;
        if(star.alpha <= 0 || star.alpha >= 1){
            star.speed *= -1;
        }

        ctx.beginPath();
        ctx.arc(star.x,star.y,star.radius,0,Math.PI*2);
        ctx.fillStyle = "rgba(255,255,255," + star.alpha + ")";
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
