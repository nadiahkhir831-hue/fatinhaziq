<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Drag and Drop</title>
    <script src="https://kit.fontawesome.com/effc47ebc5.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <section class="draggable-elements">
        <i class="fas fa cat draggable" draggable="true" style="color:#ffe4c4" id="cat"></i>
        <i class="fas fa cat draggable" draggable="true" style="color:#d1ffc4" id="dog"></i>
        <i class="fas fa cat draggable" draggable="true" style="color:#ffc4c4" id="dove"></i>
        <i class="fas fa cat draggable" draggable="true" style="color:#c4efff" id="fish"></i>
        <i class="fas fa cat draggable" draggable="true" style="color:#f5c4ff" id="frog"></i>
    </section>
    <section class="droppable-elemnts"> 
        <div class="droppable" data-draggable-id=""><span>frog</span></div>
        <div class="droppable" data-draggable-id=""><span>bird</span></div>
        <div class="droppable" data-draggable-id=""><span>cat</span></div>
        <div class="droppable" data-draggable-id=""><span>fish</span></div>
        <div class="droppable" data-draggable-id=""><span>dog</span></div>
    </section>
</body>
</html>
