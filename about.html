<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>About Us</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY */
body{
    font-family:'Poppins',sans-serif;
    color:white;
    overflow:hidden;

    background:linear-gradient(-45deg,#000000,#0f0c29,#302b63,#24243e);
    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* CANVAS */
#space{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

/* HOME BUTTON */
.home-btn{
    position:absolute;
    top:20px;
    right:20px;
    text-decoration:none;
    background:rgba(255,255,255,0.08);
    color:white;
    padding:10px 18px;
    border-radius:30px;
    font-size:14px;
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(10px);
    transition:0.3s;
}

.home-btn:hover{
    background:#00fff0;
    color:black;
    box-shadow:0 0 15px #00fff0;
}

/* SECTION */
.about-section{
    min-height:100vh;
    padding:80px 20px;
    text-align:center;
}

/* TITLE */
h1{
    font-size:45px;
    margin-bottom:60px;
    color:#00fff0;
    text-shadow:0 0 10px #00fff0;
}

/* CARD CONTAINER */
.card-container{
    display:flex;
    justify-content:center;
    gap:50px;
    flex-wrap:wrap;
}

/* CARD */
.flip-card{
    width:250px;
    height:350px;
    perspective:1000px;
}

.flip-card-inner{
    width:100%;
    height:100%;
    position:relative;
    transition:0.8s;
    transform-style:preserve-3d;
}

.flip-card:hover .flip-card-inner{
    transform:rotateY(180deg) scale(1.05);
}

/* FRONT & BACK */
.flip-card-front,
.flip-card-back{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:20px;
    padding:20px;
    backface-visibility:hidden;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);

    box-shadow:0 0 30px rgba(0,255,255,0.1);
}

/* FRONT */
.flip-card-front{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.flip-card-front img{
    width:110px;
    height:110px;
    border-radius:50%;
    margin-bottom:15px;
    border:2px solid #00fff0;
}

.flip-card-front h3{
    margin-top:10px;
    color:#fff;
}

/* BACK */
.flip-card-back{
    transform:rotateY(180deg);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

/* BUTTON */
.view-btn{
    text-decoration:none;
    background:#00fff0;
    color:black;
    padding:10px 18px;
    border-radius:30px;
    font-weight:600;
    margin:8px 0;
    transition:0.3s;
}

.view-btn:hover{
    box-shadow:0 0 15px #00fff0;
    transform:scale(1.05);
}

/* WHATSAPP */
.whatsapp-btn{
    text-decoration:none;
    background:#25D366;
    color:white;
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    transition:0.3s;
}

.whatsapp-btn:hover{
    box-shadow:0 0 10px #25D366;
    transform:scale(1.05);
}

</style>
</head>

<body>

<canvas id="space"></canvas>

<a href="index.html" class="home-btn">Home</a>

<section class="about-section">
<h1>Our Team</h1>

<div class="card-container">

<!-- CARD 1 -->
<div class="flip-card">
<div class="flip-card-inner">

<div class="flip-card-front">
<img src="haziq.jpeg">
<h3>Mohd Haziq</h3>
</div>

<div class="flip-card-back">
<a href="Job sheet haziq.html" class="view-btn">View Job Sheet</a>
<a href="https://wa.me/601121906304" target="_blank" class="whatsapp-btn">
WhatsApp
</a>
</div>

</div>
</div>

<!-- CARD 2 -->
<div class="flip-card">
<div class="flip-card-inner">

<div class="flip-card-front">
<img src="fatin.jpeg">
<h3>Nurfatin Nadiah</h3>
</div>

<div class="flip-card-back">
<a href="Job sheet fatin.html" class="view-btn">View Job Sheet</a>
<a href="https://wa.me/601117761233" target="_blank" class="whatsapp-btn">
WhatsApp
</a>
</div>

</div>
</div>

</div>
</section>

<!-- STAR SCRIPT -->
<script>
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

for(let i=0;i<180;i++){
    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        radius:Math.random()*1.2,
        alpha:Math.random(),
        speed:Math.random()*0.02
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    stars.forEach(star=>{
        star.alpha += star.speed;
        if(star.alpha <= 0 || star.alpha >= 1){
            star.speed *= -1;
        }

        ctx.beginPath();
        ctx.arc(star.x,star.y,star.radius,0,Math.PI*2);
        ctx.fillStyle = "rgba(255,255,255," + star.alpha + ")";
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
