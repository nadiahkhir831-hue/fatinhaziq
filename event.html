<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial jQuery-fatin</title>
    <script src="jquery-4.0.0.js"></script>

    <style>
        body {
            font-size: 16px;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .header {
            background-color: rgb(56, 197, 148);
            padding: 20px;
            text-align: center;
            color: rgb(191, 62, 62)
        }

        .container {
            padding: 50px;
            text-align: center;
        }

        button {
            padding: 12px 24px;
            cursor: pointer;
            margin: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
        }

        #tombol { background-color: #e74c3c; color: white; }
        #tombol2 { background-color: #2ecc71; color: white; }

        #gbr1 {
            margin-top: 30px;
            border: 5px solid #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            cursor: crosshair; /* Tukar cursor supaya user tahu boleh interaksi dengan gambar */
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Tutorial jQuery-fatin</h1>
    </div>

    <div class="container">
        <h1>Mouse Event</h1>
        
        <button id="tombol">Hilang</button>
        <button id="tombol2">Muncul</button>

        <br><br>

        <img id="gbr1" src="meme.jpg" width="300px" alt="Gambar"/>
    </div>

    <script type="text/javascript">
        $(document).ready(function() {
            
            // 1. Bila mouse lalu (over) DI ATAS GAMBAR
            $('#gbr1').on('mouseenter', function() {
                // Gambar Shin Chan bertukar kepada ikan.jpeg
                $(this).attr('src', 'meme2.jpg');
            });

            // (Opsional) Bila mouse keluar dari gambar, tukar balik ke asal
            $('#gbr1').on('mouseleave', function() {
                $(this).attr('src', 'meme.jpg');
            });

            // 2. Bila klik butang "Tumbuk saya"
            $('#tombol').on('click', function() {
                $('#gbr1').hide();
            });

            // 3. Bila klik butang "Hidup Semula"
            $('#tombol2').on('click', function() {
                $('#gbr1').show();
                // Pastikan gambar yang muncul semula adalah ikan.jpeg
                $('#gbr1').attr('src', 'meme2.jpg');
            });

        });
    </script>

</body>
</html>
