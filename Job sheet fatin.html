<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatin AI Dashboard</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

/* BODY */
body{
    font-family:'Poppins',sans-serif;
    color:white;
    min-height:100vh;
    overflow:hidden;

    background:linear-gradient(-45deg,#000000,#0f0c29,#302b63,#24243e);
    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* CANVAS */
#space{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 30px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.navbar h2{
    color:#00fff0;
}

nav a{
    text-decoration:none;
    color:white;
    padding:8px 18px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,0.2);
    transition:0.3s;
}

nav a:hover{
    background:#00fff0;
    color:black;
    box-shadow:0 0 15px #00fff0;
}

/* TITLE */
.page-title{
    text-align:center;
    margin-top:40px;
    font-size:28px;
    color:#ff00ff;
}

/* CONTAINER */
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
    padding:40px 20px 60px;
}

/* CARD */
.card{
    width:230px;
    padding:20px;
    border-radius:20px;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);

    text-align:center;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
    box-shadow:0 0 25px rgba(0,255,255,0.2);
}

/* TITLE CARD */
.card h3{
    margin-bottom:15px;
    font-size:18px;
    color:#00fff0;
}

/* BUTTON GROUP */
.btn-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}

/* BUTTON */
.btn-show{
    padding:8px;
    border-radius:20px;
    text-decoration:none;
    font-size:14px;
    font-weight:500;

    background:rgba(255,255,255,0.08);
    color:white;
    border:1px solid rgba(255,255,255,0.2);

    transition:0.3s;
}

.btn-show:hover{
    background:#ff00ff;
    color:white;
    box-shadow:0 0 12px #ff00ff;
    transform:scale(1.05);
}

/* RESPONSIVE */
@media(max-width:768px){
    .card{
        width:45%;
    }
}

@media(max-width:480px){
    .card{
        width:90%;
    }
}

</style>
</head>

<body>

<canvas id="space"></canvas>

<header>
    <div class="navbar">
        <h2>Fatin Dashboard</h2>
        <nav>
            <a href="about.html">Back</a>
        </nav>
    </div>
</header>

<h2 class="page-title">📂 Jobsheet Collection</h2>

<main>
<div class="container">

<!-- HTML -->
<div class="card">
    <h3>HTML</h3>
    <div class="btn-group">
        <a href="Job sheet 1.html" class="btn-show">Jobsheet 1</a>
        <a href="Job sheet 2.html" class="btn-show">Jobsheet 2</a>
        <a href="Job sheet 3.html" class="btn-show">Jobsheet 3</a>
    </div>
</div>

<!-- CSS -->
<div class="card">
    <h3>CSS</h3>
    <div class="btn-group">
        <a href="job sheet 4.html" class="btn-show">Jobsheet 4</a>
        <a href="Job sheet 5.html" class="btn-show">Jobsheet 5</a>
        <a href="Job sheet 6.html" class="btn-show">Jobsheet 6</a>
    </div>
</div>

<!-- JS -->
<div class="card">
    <h3>JavaScript</h3>
    <div class="btn-group">
        <a href="Job sheet 7.html" class="btn-show">Jobsheet 7</a>
        <a href="Job sheet 8.html" class="btn-show">Jobsheet 8</a>
        <a href="Job sheet 9.html" class="btn-show">Jobsheet 9</a>
    </div>
</div>

<!-- JQUERY -->
<div class="card">
    <h3>jQuery</h3>
    <div class="btn-group">
        <a href="jquery1.html" class="btn-show">JQuery 1</a>
        <a href="event.html" class="btn-show">JQuery 2</a>
    </div>
</div>

<!-- STORAGE -->
<div class="card">
    <h3>Web Storage</h3>
    <div class="btn-group">
        <a href="hapus nama.html" class="btn-show">Storage 1</a>
        <a href="dark mode.html" class="btn-show">Storage 2</a>
    </div>
</div>

</div>
</main>

<script>
const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];
for(let i=0;i<180;i++){
    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        radius:Math.random()*1.2,
        alpha:Math.random(),
        speed:Math.random()*0.02
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    stars.forEach(star=>{
        star.alpha+=star.speed;
        if(star.alpha<=0||star.alpha>=1){
            star.speed*=-1;
        }

        ctx.beginPath();
        ctx.arc(star.x,star.y,star.radius,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,"+star.alpha+")";
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize",()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});
</script>

</body>
</html>
